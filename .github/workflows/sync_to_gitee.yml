name: Sync release to Gitee

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_USER: "gimao-apps"
      GITEE_REPO: "gimao-apps/onDevice" # 格式 owner/repo
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Add Gitee remote (HTTPS)
        run: |
          # remote url: https://{user}:{token}@gitee.com/{owner}/{repo}.git
          GITEE_REMOTE="https://$GITEE_USER:$GITEE_TOKEN@gitee.com/${GITEE_REPO}.git"
          git remote add gitee "$GITEE_REMOTE"
          # push current branch and all tags
          git push gitee --all
          git push gitee --tags

      - name: Create Release on Gitee
        id: create_release
        run: |
          TAG_NAME="${GITHUB_REF##*/}"   # release tag
          TITLE="${{ github.event.release.name }}"
          BODY="${{ github.event.release.body || '' }}"
          TARGET_COMMITISH="${{ github.event.release.target_commitish || github.sha }}"

          API="https://gitee.com/api/v5/repos/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}"
          RESP=$(jq -n --arg tag "$TAG_NAME" --arg name "$TITLE" --arg body "$BODY" \
            --arg target "$TARGET_COMMITISH" \
            '{tag_name: $tag, name: $name, description: $body, target_commitish: $target}')
          echo "payload=$RESP"

          RESULT=$(curl -s -X POST -H "Content-Type: application/json" -d "$RESP" "$API")
          echo "result: $RESULT"
          RELEASE_ID=$(echo "$RESULT" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create Gitee release: $RESULT"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload assets to Gitee release (optional)
        if: always() && steps.create_release.outputs.release_id != ''
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/assets?access_token=${GITEE_TOKEN}"

          # 假设构建产物放在 ./dist，上传所有文件
          if [ -d dist ]; then
            for f in dist/*; do
              echo "Uploading $f ..."
              curl -s -X POST -F "file=@${f}" "${API}" || { echo "upload failed for $f"; exit 1; }
            done
          else
            echo "No dist directory, skipping asset upload"
          fi
