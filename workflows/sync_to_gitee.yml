name: Sync All Release Assets to Gitee

on:
  release:
    types: [published] # 触发条件：当你在 GitHub 成功点击 "Publish release" 时

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出 GitHub 仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 自动把 GitHub Release 的所有文件下载到工作区
      - name: Download All GitHub Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name }}
          fileName: "*" # 代表匹配并下载所有附加的文件（APK/ZIP等）
          out-file-path: "./release-assets"

      # 3. 使用专门的 Gitee Release Action 将所有内容与文件推送到 Gitee
      - name: Create Gitee Release and Upload Assets
        uses: niannian01/action-gitee-release@v1.0.1
        with:
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          # 注意：请务必将下面两行修改为你自己在 Gitee 上的真实用户名和仓库名
          gitee-username: "gimao-apps"
          gitee-repo: "onDevice"
          
          # 自动同步 GitHub 的 Tag、标题、日志内容
          tag: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          
          # 将刚才下载的文件夹内的所有附件，同步上传到 Gitee 对应的发行版列表中
          files: "./release-assets/*"
