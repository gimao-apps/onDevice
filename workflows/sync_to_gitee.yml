name: Sync Release to Gitee

on:
  release:
    types: [published] # 当在 GitHub 发布新 Release 时触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 下载 GitHub 当前 Release 的附件（例如您的 APK）
      - name: Download GitHub Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name }}
          fileName: "*" # 下载所有附件
          out-file-path: "./downloads"

      # 2. 将 Release 同步到 Gitee
      - name: Create Gitee Release
        run: |
          # 获取 GitHub 的 Release 信息
          TAG_NAME="${{ github.event.release.tag_name }}"
          RELEASE_TITLE="${{ github.event.release.name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          
          # Gitee 用户名和仓库名（请根据实际情况修改）
          GITEE_OWNER="您的Gitee用户名"
          GITEE_REPO="您的Gitee仓库名"
          
          echo "正在向 Gitee 创建 Release: $TAG_NAME"
          
          # 通过 Gitee API 创建 Release
          # 注意：Gitee API 创建 Release 的同时可以直接上传附件
          # 这里使用 curl 循环上传下载好的文件
          for file in ./downloads/*; do
            if [ -f "$file" ]; then
              echo "正在上传 $file 到 Gitee..."
              curl -X POST "https://gitee.com{GITEE_OWNER}/${GITEE_REPO}/releases" \
                -F "access_token=${{ secrets.GITEE_TOKEN }}" \
                -F "tag_name=${TAG_NAME}" \
                -F "name=${RELEASE_TITLE}" \
                -F "body=${RELEASE_BODY}" \
                -F "file=@${file}"
            fi
          done
